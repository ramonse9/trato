name: Verificación

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: trato
          POSTGRES_PASSWORD: trato_ci_password
          POSTGRES_DB: trato_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trato -d trato_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      API_PORT: 3100
      WEB_ORIGIN: http://127.0.0.1:4300
      TZ: America/Mazatlan
      DATABASE_URL: postgresql://trato:trato_ci_password@127.0.0.1:5432/trato_e2e?schema=public
      TEST_DATABASE_URL: postgresql://trato:trato_ci_password@127.0.0.1:5432/trato_e2e?schema=public
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run verify
      - run: npm run db:deploy
      - run: npm run test:e2e
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Guardar reporte del navegador
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
